# Habitar Commons — ruleset do validador de compatibilidade
# spec: mome.habitar.commons · versão 1.3 · 08 nov 2026
# Autores: Francisco Rocha Antunes, Filipa Serôdio Pinheiro · MOME, Porto
# Licença: CC BY-SA 4.0 — https://creativecommons.org/licenses/by-sa/4.0/
# Documento técnico de referência, não jurídico.
#
# Severidades: error (impede declarar conformidade) · warning (pede clarificação) · info (boa prática)
# Operadores: eq, ne, in, not_in, contains, contains_any, contains_all, exists, not_exists, differs_from
# Regras com jurisdiction: [PT] só se aplicam a manifestos com jurisdição PT.

spec: mome.habitar.commons
ruleset_version: "1.3"
license: CC-BY-SA-4.0

rules:

  # ── Eixos (v1.0, alterada na v1.1) ─────────────────────────────
  - id: AX002
    severity: error
    message: "F-MTG exige R-OWN, R-REAL-LIM:SURF ou R-REAL-LIM:USUF."
    when: {all: [{path: axes.finance, op: contains, value: F-MTG}]}
    then: {any: [
      {path: axes.resident_right, op: eq, value: R-OWN},
      {path: axes.resident_right, op: eq, value: "R-REAL-LIM:SURF"},
      {path: axes.resident_right, op: eq, value: "R-REAL-LIM:USUF"}]}

  # ── Overlays (v1.0) ────────────────────────────────────────────
  - id: OV001
    severity: error
    message: "O-COLIV exige U-GUEST e U-ROOMS."
    when: {all: [{path: overlays, op: contains, value: O-COLIV}]}
    then: {all: [{path: modules.use, op: contains_all, value: [U-GUEST, U-ROOMS]}]}

  # ── Jurisdição PT (v1.1) ───────────────────────────────────────
  - id: PT001
    severity: error
    jurisdiction: [PT]
    message: "O DUH não pode ser onerado (art. 1488.º do Código Civil): F-MTG proibido."
    when: {all: [{path: axes.resident_right, op: eq, value: "R-REAL-LIM:DUH"}]}
    then: {all: [{path: axes.finance, op: not_in, value: [F-MTG]}]}

  - id: PT002
    severity: warning
    jurisdiction: [PT]
    message: "DUH com transmissão interna: declarar o mecanismo (renúncia ou extinção e nova constituição)."
    when: {all: [{path: axes.resident_right, op: eq, value: "R-REAL-LIM:DUH"}, {path: axes.transfer, op: eq, value: TR-INT}]}
    then: {all: [{path: parameters.transfer_mechanism, op: exists}]}

  # ── Vinculação da acessibilidade (v1.1) ────────────────────────
  - id: LK001
    severity: warning
    message: "Teto ou custo sem vinculação: justificar ou rever o lock."
    when: {all: [{path: axes.economics, op: contains_any, value: [E-CAP, E-COST]}, {path: axes.lock, op: eq, value: L-0}]}
    then: {all: [{path: parameters.lock_rationale, op: exists}]}

  - id: LK002
    severity: error
    message: "L-TERM exige lock_years."
    when: {all: [{path: axes.lock, op: eq, value: L-TERM}]}
    then: {all: [{path: parameters.lock_years, op: exists}]}

  - id: LK003
    severity: error
    message: "L-SURF exige solo e edifício com titulares diferentes (ou R-REAL-LIM:SURF) e reversão declarada."
    when: {all: [{path: axes.lock, op: eq, value: L-SURF}]}
    then: {all: [
      {any: [{path: axes.land_owner, op: differs_from, value: axes.asset_owner}, {path: axes.resident_right, op: eq, value: "R-REAL-LIM:SURF"}]},
      {path: axes.reversion, op: ne, value: RV-0}]}

  # ── Solo, edifício e reversão (v1.1) ───────────────────────────
  - id: LD001
    severity: error
    message: "Titular do solo diferente do edifício exige reversão e prazo da superfície."
    when: {all: [{path: axes.land_owner, op: differs_from, value: axes.asset_owner}]}
    then: {all: [{path: axes.reversion, op: exists}, {path: parameters.surface_term, op: exists}]}

  - id: LD002
    severity: warning
    message: "Reversão para proprietário privado com vinculação longa: declarar a proteção da acessibilidade após a reversão."
    when: {all: [{path: axes.reversion, op: eq, value: RV-PRIV}, {path: axes.lock, op: in, value: [L-SURF, L-PERP]}]}
    then: {all: [{path: parameters.post_reversion_protection, op: exists}]}

  # ── Intermediação (v1.1) ───────────────────────────────────────
  - id: NM001
    severity: error
    message: "N-ML exige governação G-PUBADM ou G-MULTI e o risco de vacância declarado na Camada 6."
    when: {all: [{path: modules.intermediation, op: contains, value: N-ML}]}
    then: {all: [{path: axes.governance, op: in, value: [G-PUBADM, G-MULTI]}, {path: operation.vacancy_risk, op: exists}]}

  # ── Fases (v1.1) ───────────────────────────────────────────────
  - id: PH001
    severity: error
    message: "Fase PH-DEV com eixos distintos de PH-OP: headline calculado a partir de PH-OP; declarar o evento de transição."
    when: {all: [{path: phases, op: contains, value: PH-DEV}]}
    then: {all: [{path: phases.PH-DEV.transition_event, op: exists}]}

  - id: PH002
    severity: error
    message: "Reversão diferente de RV-0 exige a fase PH-END."
    when: {all: [{path: axes.reversion, op: in, value: [RV-PUB, RV-PRIV]}]}
    then: {all: [{path: phases, op: contains, value: PH-END}]}

  # ── Financiamento de impacto (v1.1) ────────────────────────────
  - id: FI001
    severity: info
    message: "F-NIS: declarar também F-IMPACT, cupão, horizonte e métrica de impacto."
    when: {all: [{path: axes.finance, op: contains, value: F-NIS}]}
    then: {all: [{path: axes.finance, op: contains, value: F-IMPACT}, {path: parameters.nis, op: exists}]}

  # ── Camada 6 — estrutura da operação (v1.1–v1.2) ───────────────
  - id: OP001
    severity: warning
    message: "D-FEE: declarar RT-FEE, a fórmula do fee e a sua transparência perante residentes ou cooperadores."
    when: {all: [{path: operation.developer, op: contains, value: D-FEE}]}
    then: {all: [{path: operation.developer_return, op: eq, value: RT-FEE}, {path: parameters.fee_formula, op: exists}]}

  - id: OP002
    severity: warning
    message: "Edifício cooperativo sem autopromoção cooperativa: confirmar quem é dono de obra."
    when: {all: [{path: axes.asset_owner, op: eq, value: A-COOP}, {path: operation.developer, op: not_in, value: [D-COOP]}]}
    then: {all: [{path: operation.works_owner, op: exists}]}

  - id: AL001
    severity: warning
    message: "Elegibilidade intermédia ou social, ou intermediação: declarar quem atribui as casas (allocator)."
    when: {any: [{path: axes.targeting, op: contains_any, value: [Q-MID, Q-SOC]}, {path: modules.intermediation, op: contains, value: N-ML}]}
    then: {all: [{path: operation.allocator, op: exists}]}

  # ── Quem paga (v1.3) ───────────────────────────────────────────
  - id: PY001
    severity: error
    message: "E-SUB exige um pagador público ou social (PY-PUB-PERS, PY-PUB-PROJ ou PY-SOC)."
    when: {all: [{path: axes.economics, op: contains, value: E-SUB}]}
    then: {all: [{path: axes.payer, op: contains_any, value: [PY-PUB-PERS, PY-PUB-PROJ, PY-SOC]}]}

  - id: PY002
    severity: warning
    message: "Pagador público ou social: declarar a duração do compromisso público e o que acontece se a verba anual falhar."
    when: {all: [{path: axes.payer, op: contains_any, value: [PY-PUB-PERS, PY-PUB-PROJ, PY-SOC]}]}
    then: {all: [{path: parameters.public_commitment, op: exists}]}

  # ── Revisão da renda (v1.3) ────────────────────────────────────
  - id: RX001
    severity: error
    message: "Com teto e vinculação ativa, a renda não pode ser revista a mercado (RX-MKT)."
    when: {all: [{path: axes.economics, op: contains, value: E-CAP}, {path: axes.lock, op: in, value: [L-TERM, L-SURF, L-PERP]}]}
    then: {all: [{path: axes.revision, op: ne, value: RX-MKT}]}

  - id: RX002
    severity: warning
    message: "E-COST: a revisão deve ser RX-COST, ou justificar a alternativa."
    when: {all: [{path: axes.economics, op: contains, value: E-COST}]}
    then: {any: [{path: axes.revision, op: contains, value: RX-COST}, {path: parameters.revision_rationale, op: exists}]}

  - id: RX003
    severity: error
    message: "RX-STEP, RX-CPI ou RX-CAPCPI exigem índice ou taxa, periodicidade e, no RX-CAPCPI, teto."
    when: {all: [{path: axes.revision, op: contains_any, value: [RX-STEP, RX-CPI, RX-CAPCPI]}]}
    then: {all: [{path: parameters.revision.index_or_rate, op: exists}, {path: parameters.revision.period, op: exists}]}

  # ── População-alvo (v1.3) ──────────────────────────────────────
  - id: PO001
    severity: warning
    message: "População restrita: declarar a base legal e o critério de verificação (não discriminação)."
    when: {all: [{path: axes.population, op: not_in, value: [PO-GEN]}]}
    then: {all: [{path: parameters.population_legal_basis, op: exists}]}

  - id: PO002
    severity: info
    message: "Seniores sem cuidado previsto: declarar o percurso se o residente passar a precisar de cuidados."
    when: {all: [{path: axes.population, op: contains, value: PO-SEN}, {path: overlays, op: not_in, value: [O-CARE]}]}
    then: {all: [{path: parameters.care_pathway, op: exists}]}

  # ── Cohousing (v1.3) ───────────────────────────────────────────
  - id: CO001
    severity: error
    message: "O-COHOUS exige governação G-1P1V ou G-MULTI e ROLE-COMM entre quem atribui as casas."
    when: {all: [{path: overlays, op: contains, value: O-COHOUS}]}
    then: {all: [{path: axes.governance, op: contains_any, value: [G-1P1V, G-MULTI]}, {path: operation.allocator, op: contains, value: ROLE-COMM}]}

  # ── Usufruto e entrada (v1.3) ──────────────────────────────────
  - id: US001
    severity: error
    message: "T-LIFE exige R-REAL-LIM:USUF ou :DUH e a fase PH-END com o óbito como evento."
    when: {all: [{path: axes.term, op: eq, value: T-LIFE}]}
    then: {all: [
      {path: axes.resident_right, op: in, value: ["R-REAL-LIM:USUF", "R-REAL-LIM:DUH"]},
      {path: phases, op: contains, value: PH-END}]}

  - id: US002
    severity: warning
    message: "E-ENTRY: declarar o método de cálculo da entrada e as regras de reembolso em caso de saída antecipada."
    when: {all: [{path: axes.economics, op: contains, value: E-ENTRY}]}
    then: {all: [{path: parameters.entry_method, op: exists}, {path: parameters.refund_rules, op: exists}]}

  # ── Catálogo ───────────────────────────────────────────────────
  - id: CAT001
    severity: info
    message: "Headline fora dos 18 perfis: combinação válida sem cartão próprio; propor perfil se for replicável."
    when: {all: [{path: headline, op: not_in, value: catalog.v1_3.headlines}]}
    then: {all: []}

catalog:
  v1_3:
    headlines: [H-OWN-MKT-PERM, H-OWN-COST-PERM, H-COHO-COST-PERM, H-OWN-CAP-PERM, H-HYB-CAP-LONG,
                H-LEASE-MKT-MID, H-LEASE-MKT-LONG, H-LIC-MKT-SHORT,
                H-LEASE-CAP-LONG, H-LEASE-COST-LONG, H-LEASE-INCOME-LONG, H-TEMP-SUB-SHORT,
                H-MEMB-COST-LONG, H-MEMB-INCOME-LONG, H-MEMB-COST-MID,
                H-REAL-CAP-LONG, H-REAL-ENTRY-LIFE, H-TRUST-COST-LONG]

# Habitar Commons — modelo HC-CR-MID (família HC, COLETIVA)
# spec: mome.habitar.commons · versão 2.0-rc1 · 20 nov 2026
# Autores: Francisco Rocha Antunes, Filipa Serôdio Pinheiro · MOME, Porto · CC BY-SA 4.0
# Documento técnico de referência, não jurídico. Modelo e não licença (decisão 34): não substitui
# estatutos, regulamentos nem contratos. O regime cooperativo (transmissão, oneração, reembolso
# e acesso da segunda geração) está sujeito a parecer jurídico (decisões 29 e 30; questões 1 a 4).

spec: mome.habitar.commons
spec_version: "2.0-rc1"
spec_license: CC-BY-SA-4.0
kind: template
status: under_review
id: hc-cr-mid
profile: coop-cost                     # P13
family: HC
version: "2.0-rc1"
jurisdiction: [PT]

headline: H-MEMB-COST-MBR-PERP          # derivado (HL001)
occupancy_title: OT-RIGHT

axes:
  asset_owner: {nature: A-COOP, regime: AR-FULL, purpose: PU-COOP}
  land_owner:  {nature: A-COOP, regime: AR-FULL, purpose: PU-COOP}   # em superfície: A-PUB, A-FUND ou A-ASSOC
  reversion: RV-0                        # em superfície: RV-PUB ou RV-PRIV, com PH-END (PH002)
  resident_right: "R-REAL-LIM:DUH"       # direito de habitação cooperativo (DL 502/99, arts. 19.º a 24.º)
  right_condition: [MEMB]
  term:
    type: membership
    category: T-MBR
    duration: null                       # sem prazo: dura enquanto o titular ou o sucessor for cooperador
    termination: {events: [demissao, exclusao, morte_sem_sucessor_admitido], legal_basis: "DL 502/99, arts. 22.º, n.º 2, 23.º e 24.º"}
  transfer:
    code: TR-APP
    inter_vivos: {requires: [admissao_como_cooperador, acordo_da_assembleia_geral], legal_basis: "DL 502/99, art. 22.º, n.º 1"}
    mortis_causa: {requires: [inscricao_do_sucessor], legal_basis: "DL 502/99, art. 22.º, n.º 2"}
  economics: {base: E-COST, cap: E-CAP}
  value_capture: {resident: V-0, entity: V-0}
  finance: [F-COLFIN]                    # opcional: F-IMPACT, F-NIS. Sem F-MTG sobre o direito (PT001)
  governance: [G-1P1V]
  safeguards: [S-PROT-VULN]
  targeting: Q-MID                       # através dos critérios de inclusão em programas (art. 9.º)
  population: [PO-GEN]
  lock: {code: L-PERP, type: open, basis: estatutos}
  revision: [RX-COST, RX-FIN]            # RX-FIN depois da amortização (art. 19.º, n.º 4)

flows:
  - id: titulos
    type: FL-CAP
    description: "Títulos de participação no valor do custo do fogo (art. 20.º, n.º 1)"
    payer: [{code: PY-RES, share: 1.0}]
    recipient: ROLE-COOP
    refund: {when: [demissao, exclusao], value: valor_nominal_com_juros, timing: null, legal_basis: "DL 502/99, art. 24.º"}
  - id: preco_do_direito
    type: FL-OCC
    description: "Quota-parte dos encargos financeiros e de administração (art. 19.º, n.os 2 a 4)"
    payer: [{code: PY-RES, share: 1.0}]
    recipient: ROLE-COOP
  - id: fundo_de_conservacao
    type: FL-OCC
    description: "Contribuições para o fundo de conservação e reparação (art. 12.º)"
    payer: [{code: PY-RES, share: 1.0}]
    recipient: ROLE-COOP

pricing:
  energy:  {inclusion: IN-RES, form: PF-USE, contract_holder: resident}
  water:   {inclusion: IN-RES, form: PF-USE, contract_holder: resident}
  telecom: {inclusion: IN-RES, form: PF-FIX, contract_holder: resident}

functions:
  sleep:   {where: unit}
  hygiene: {where: unit}
  cook:    {where: unit}
  living:  {where: unit}
  laundry: {where: unit}
unit: {area_m2: null, households: 1}
common_spaces: []

building:
  unit_constitution: fracao_autonoma
  authorized_use: habitacao
  typology: null
  accessibility: {regime: "DL 163/2006", status: null}
  energy_certificate: null

overlays: {spatial: [O-UNIT], relational: [], programmatic: []}
services: []

modules: {use: [U-UP, U-SUB-T], mobility: [M-MI], improvements: [I-COMP-LIM], intermediation: [N-0]}

institutional:
  participation_duty: estatutaria
  resident_bodies: [assembleia_geral, direcao, conselho_fiscal]
  admission: {allocator: ROLE-COOP, legal_basis: "DL 502/99, arts. 8.º e 9.º"}

phases:
  - id: PH-DEV
    transition_event: atribuicao_do_direito_por_escritura
    construction: {works_owner: ROLE-COOP, builder: ROLE-BLD, modality: empreitada, defects_warranty: null}
  - id: PH-OP

operation:
  public:
    developer: [D-COOP, D-FEE]
    owner_vehicle: cooperativa
    developer_return: RT-FEE
    developer_exit: X-FEE
    holding_period: indeterminado
    leverage: null
    collateral_use: null
    allocator: [ROLE-COOP]
    continuity: {clause_ref: null, amendment_majority: null}
    replacement_reserve: {holder: ROLE-COOP, rule: fundo_de_conservacao, legal_basis: "DL 502/99, art. 12.º"}
  private:
    works_owner: ROLE-COOP
    vacancy_risk: ROLE-COOP
    default_risk: ROLE-COOP

parameters:
  transfer_mechanism: {value: alienacao_art22, legal_basis: "DL 502/99, art. 22.º"}
  statutes_ref: null                     # restrições estatutárias: declarar aqui, sujeitas a parecer
  second_generation_access: {value: null, legal_basis: "DL 502/99, art. 20.º, n.º 2"}
  refund_timing: {value: null, note: "questão em aberto 2"}
  sanctions_procedure: {legal_basis: "Lei n.º 119/2015, arts. 25.º e 26.º", exclusion_before_restitution: true}
  fee_formula: {value: null, disclosure: null}
  jurisdiction:
    PT:
      regimes: [pt.coop_dh, pt.coop_fundos, pt.ccoop_disciplina, pt.ccoop_reembolso, pt.ccoop_reservas]

evaluation:
  poe: {level: indicativo, evaluator: ROLE-EVAL, last_date: null, output: relatorio_de_divergencias}
  data_rules: {consent: required, publication: aggregated, individual_data_in_manifest: false}

seal: {commons: false, candidate: true}

history:
  - version: "2.0-rc1"
    lock: L-PERP
    value_capture: V-0
    safeguards: [S-PROT-VULN]
    reason: "Modelo reescrito segundo o regime do DL 502/99 (decisões 29 e 30, sujeitas a parecer)"

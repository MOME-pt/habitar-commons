spec: mome.habitar.commons
spec_version: "1.3"
kind: license
id: HC-CR-MID
family: HC
version: "1.3"
jurisdiction: [PT]
license: CC-BY-SA-4.0                # standard Habitar Commons; atribuição: Francisco Rocha Antunes, Filipa Serôdio Pinheiro, MOME
headline: H-MEMB-COST-LONG          # calculado a partir de PH-OP

axes:
  asset_owner: A-COOP               # titular do edifício
  land_owner: A-COOP                # parâmetro: A-PUB / A-TRUST se em superfície
  reversion: RV-0                   # RV-PUB / RV-PRIV se em superfície
  resident_right: R-REAL-LIM:DUH
  right_condition: [MEMB]
  term: T-LONG
  transfer: TR-INT
  economics: [E-COST, E-CAP]
  value_capture: V-0
  finance: [F-COLFIN]               # opcional: F-IMPACT, F-NIS (nunca F-MTG: PT001)
  governance: G-1P1V
  safeguards: [S-ESC, S-VULN]
  targeting: Q-MID
  lock: L-PERP                      # L-SURF se land_owner != asset_owner
  payer: [{code: PY-RES, share: 1.0}]
  revision: RX-COST                 # prestação revista pelo custo efetivo
  population: [PO-GEN]

phases:
  - id: PH-DEV
    transition_event: atribuição dos DUH após licença de utilização
  - id: PH-OP

overlays: [O-UNIT, O-SERV-0]

modules:
  use: [U-UP, U-AL0, U-SUB-T]
  mobility: [M-MI]
  improvements: [I-COMP-LIM]
  intermediation: [N-0]

operation:                          # Camada 6 (fora do cartão público)
  developer: [D-COOP, D-FEE]
  works_owner: ROLE-COOP
  revenue_recipient: ROLE-COOP
  allocator: ROLE-COOP               # admissão de cooperadores e atribuição dos DUH
  vacancy_risk: ROLE-COOP
  default_risk: ROLE-COOP
  maint_current: ROLE-COOP
  maint_structural: ROLE-COOP
  developer_return: RT-FEE
  developer_exit: X-FEE
  exit_timing: {type: milestone, description: "Entrega da obra e liquidação dos honorários."}

parameters:
  transfer_mechanism: {value: renuncia_e_nova_constituicao, description: "O DUH é intransmissível (art. 1488.º CC)."}
  sanctions_ladder: {type: object, description: "Escada sancionatória."}
  fee_formula: {type: object, description: "Fórmula e transparência do fee de promoção e gestão (OP001)."}
  surface_term: {type: integer, unit: anos, required_if: "land_owner != asset_owner"}
  jurisdiction:
    PT:
      regimes: [pt.coop_isencoes, pt.duh]
